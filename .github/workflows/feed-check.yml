name: Feed compatibility check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test public scoreboard query formats
        run: |
          python - <<'PY'
          import urllib.request,json,concurrent.futures
          paths=['basketball/nba','basketball/wnba','football/college-football','mma/ufc']
          queries=['dates=20220101-20220131&limit=1000','dates=20220101-20220131&limit=100','dates=20220101','dates=20220101-20220107&limit=1000','dates=2026&limit=1000','dates=20261021-20261104&limit=1000']
          def probe(item):
           p,q=item;u='https://site.api.espn.com/apis/site/v2/sports/'+p+'/scoreboard?'+q
           try:
            with urllib.request.urlopen(u,timeout=30) as r:j=json.load(r)
            events=j.get('events',[]);result=f'{p} {q}: OK n={len(events)} first={events[0].get("date") if events else None} last={events[-1].get("date") if events else None}'
           except Exception as e:
            result=f'{p} {q}: {str(e)}'
            if hasattr(e,'read'):result+=' '+e.read(700).decode(errors='replace').replace('\n',' ')
           print('::notice title=Feed probe::'+result,flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:list(executor.map(probe,[(p,q) for p in paths for q in queries]))
          PY

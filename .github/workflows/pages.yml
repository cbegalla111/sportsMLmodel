name: Daily model dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sportsml-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check web/app.js
      - uses: actions/configure-pages@v5
      - name: Restore public-source history
        uses: actions/cache/restore@v4
        with:
          path: .pages-runtime
          key: ${{ runner.os }}-sportsml-public-v1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-sportsml-public-v1-
      - name: Refresh all feeds, review model improvements and build dashboard
        run: python -m scripts.build_pages --runtime .pages-runtime --output _site --refresh
      - name: Retain public-source history
        uses: actions/cache/save@v4
        with:
          path: .pages-runtime
          key: ${{ runner.os }}-sportsml-public-v1-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
